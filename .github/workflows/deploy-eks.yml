name: Build & Deploy to EKS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write # needed for OIDC → AWS
  contents: read # needed to checkout the repo

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Avoid overlapping deploys from the same branch
    concurrency:
      group: autoblur-scrape-service-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-autoblur-scrape-service
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Building image: ${IMAGE_URI}"
          docker build -t "${IMAGE_URI}" .

      - name: Push Docker image to ECR
        run: |
          echo "Pushing image: ${IMAGE_URI}"
          docker push "${IMAGE_URI}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Prepare rendered deployment manifest
        run: |
          mkdir -p k8s/rendered
          sed "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" deployment.yaml > k8s/rendered/deployment.yaml
          echo "Rendered deployment manifest:"
          head -n 30 k8s/rendered/deployment.yaml

      - name: Deploy to EKS
        env:
          DEPLOYMENT_NAME: autoblur-scrape-service
          APP_LABEL: autoblur-scrape-service
        run: |
          set -e

          echo "Applying manifests..."
          kubectl apply -f k8s/rendered/deployment.yaml

          echo "Waiting for rollout..."
          if ! kubectl rollout status deployment/${DEPLOYMENT_NAME} --timeout=180s; then
            echo "Rollout failed, collecting debug info..."

            echo "==== Nodes ===="
            kubectl get nodes -o wide || true

            echo "==== Deployments ===="
            kubectl get deploy || true

            echo "==== ReplicaSets ===="
            kubectl get rs || true

            echo "==== Pods (all) ===="
            kubectl get pods -o wide || true

            echo "==== Describe deployment ===="
            kubectl describe deployment/${DEPLOYMENT_NAME} || true

            echo "==== Describe pods with app=${APP_LABEL} ===="
            kubectl describe pods -l app=${APP_LABEL} || true

            echo "==== Logs from pods (if any) ===="
            kubectl logs -l app=${APP_LABEL} --tail=100 || true

            exit 1
          fi

      - name: Post-deploy diagnostics
        run: |
          echo "Pods:"
          kubectl get pods -o wide
          echo "Services:"
          kubectl get svc -o wide
